<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ภาพรวมตลาด — Trading Dashboard</title>
<style>
:root{--bg:#0a0d13;--bg2:#10151e;--bg3:#161d29;--line:#222c3d;--tx:#e8eef8;
--tx2:#96a3b8;--tx3:#5c6a80;--accent:#f5b942;--glow:245,185,66;--acc:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55;
font-family:-apple-system,'Segoe UI','Leelawadee UI','Noto Sans Thai',Tahoma,sans-serif}
button{font-family:inherit;cursor:pointer}a{color:var(--acc);text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(10,13,19,.96);
backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;padding:9px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px}.logo span{color:var(--accent)}
.btn{background:var(--bg3);border:1px solid var(--line);color:var(--tx2);
padding:5px 11px;border-radius:7px;font-size:12px}
.btn:hover{color:var(--tx)}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.right{margin-left:auto;margin-right:10px;font-size:11px;color:var(--tx3)}
section{border-bottom:1px solid var(--line)}
iframe{display:block;width:100%;border:0;height:600px;background:var(--bg);overflow:hidden}
</style></head><body>
<header><div class="hbar">
  <div class="logo">TRADING <span>DASHBOARD</span></div>
  <div class="jump">
    <a class="btn" href="#s-breadth">📊 Breadth</a>
    <a class="btn" href="#s-heatmap">🔥 Heat Map</a>
    <a class="btn" href="#s-sentiment">😨 กลัว · โลภ</a>
    <a class="btn" href="#s-flow">⇄ Money Flow</a>
  </div>
  <div class="right"><button class="btn" id="bAll" style="color:var(--accent);border-color:var(--accent)">↻ ดึงข้อมูลทั้ง 4 ส่วน</button></div>
</div></header>
<section id="s-breadth"><iframe src="breadth.html" scrolling="no" title="Market Breadth"></iframe></section>
<section id="s-heatmap"><iframe src="heatmap.html" scrolling="no" title="Heat Map"></iframe></section>
<section id="s-sentiment"><iframe src="sentiment.html" scrolling="no" title="กลัว · โลภ"></iframe></section>
<section id="s-flow"><iframe src="flow.html" scrolling="no" title="Money Flow"></iframe></section>
<script>
/* ให้แต่ละส่วนสูงเท่าเนื้อหาจริง → เลื่อนทั้งหน้าเป็นหน้าเดียว */
document.querySelectorAll('section iframe').forEach(function(fr){
  function fit(){
    try{ var d=fr.contentDocument; if(!d||!d.body)return;
      var h=Math.max(d.body.scrollHeight,d.documentElement.scrollHeight);
      if(h>0)fr.style.height=h+'px'; }catch(e){}
  }
  fr.addEventListener('load',function(){
    fit();
    try{ new ResizeObserver(fit).observe(fr.contentDocument.body); }catch(e){}
    setTimeout(fit,1500); setTimeout(fit,5000);
  });
});
document.getElementById('bAll').onclick=function(){
  document.querySelectorAll('section iframe').forEach(function(fr){
    try{ var b=fr.contentDocument.getElementById('bLoad'); if(b)b.click(); }catch(e){}
  });
};
document.querySelectorAll('.jump a').forEach(function(a){
  a.onclick=function(e){ e.preventDefault();
    var t=document.querySelector(a.getAttribute('href'));
    window.scrollTo({top:t.offsetTop-56,behavior:'smooth'}); };
});
</script>
<script src="theme.js"></script>
</body></html>
