name: ดึง 13F จาก SEC

on:
  schedule:
    # ทุกวันจันทร์ 10:00 UTC — 13F ทยอยเข้ามาตลอดช่วง 45 วันหลังสิ้นไตรมาส
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  f13:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ดึง 13F
        run: node scripts/f13.mjs
      - name: บันทึกผลกลับเข้า repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add f13.json
          if git diff --staged --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "13F $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: สั่งให้ GitHub Pages สร้างเว็บใหม่
        # คอมมิตที่สร้างโดยหุ่นยนต์จะไม่ปลุกงานอื่นเอง (GitHub กันลูปไว้)
        # ถ้าไม่เรียกตรงนี้ ไฟล์จะอยู่ใน repo แต่เปิดจากเว็บไม่เจอ จนกว่าคนจะคอมมิตเอง
        if: always()
        run: |
          code=$(curl -s -o /tmp/p.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds)
          echo "สั่งสร้างเว็บใหม่ -> HTTP $code"
          cat /tmp/p.txt
          if [ "$code" != "201" ]; then
            echo "สั่งไม่สำเร็จ — ไฟล์ยังอยู่ใน repo แต่ต้องรอคอมมิตถัดไปถึงจะขึ้นเว็บ"
          fi
