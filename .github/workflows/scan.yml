name: สแกนหุ้นรายคืน

on:
  schedule:
    # 23:00 UTC = 06:00 ไทยของวันถัดไป
    #
    # ย้ายมาจาก 06:30 UTC (13:30 ไทย) เมื่อ 21 ต.ค. 2026
    # เหตุผล: งานเขียนบทสรุปข่าวอ่านไฟล์ราคาที่งานนี้เขียน แต่เดิมมันรัน
    # ตอน 06:40 ไทย ซึ่งเร็วกว่างานสแกน 7 ชั่วโมง  บทสรุปจึงหยิบราคา
    # ของรอบก่อนหน้าไปใช้เสมอ ช้ากว่าตัวเลขบนหน้าเว็บอยู่หนึ่งวันทำการ
    # ตอนนี้สแกนก่อน แล้วบทสรุปตามทีหลัง 1 ชั่วโมงครึ่ง
    #
    # ระยะห่างจากตลาดปิด (16:00 ET) เหลือ 3 ชั่วโมง และ 2 ชั่วโมงหลัง
    # สหรัฐฯ ถอยเวลาต้นเดือนพฤศจิกายน เพราะไทยไม่ปรับเวลาตามฤดูกาล
    # ถ้าวันไหนข้อมูลมาไม่ทัน asof จะไม่ขยับ และป้ายวันที่บนหน้าเว็บ
    # จะเปลี่ยนสีเตือนเอง ไม่ใช่ความเสี่ยงแบบเงียบ
    - cron: '0 23 * * 1,2,3,4,5'
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: สแกน
        run: node scripts/scan.mjs
        env:
          SCAN_WORKERS: '8'

      - name: บันทึกผลกลับเข้า repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan.json
          if git diff --staged --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "สแกนหุ้น $(date -u +%Y-%m-%d)"
            git push
          fi
