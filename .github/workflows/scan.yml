name: สแกนหุ้นรายคืน

on:
  schedule:
    # 06:30 UTC = 13:30 ไทย — หลังตลาดสหรัฐฯ ปิดและข้อมูลวันก่อนนิ่งแล้ว
    - cron: '30 6 * * 2,3,4,5,6'
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: สแกน
        run: node scripts/scan.mjs
        env:
          SCAN_WORKERS: '8'
          # เส้นตายของสคริปต์ ต้องต่ำกว่า timeout-minutes ข้างบน
          # เพื่อให้สคริปต์ได้สรุปสาเหตุลงล็อกก่อน GitHub ตัดงานทิ้ง
          SCAN_DEADLINE_MIN: '40'

      - name: บันทึกผลกลับเข้า repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan.json styles.json
          if git diff --staged --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "สแกนหุ้น + สไตล์ลงทุน $(date -u +%Y-%m-%d)"
            git push
          fi
